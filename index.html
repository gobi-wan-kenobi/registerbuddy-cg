<div class="main"><header class="topbar"><div class="breadcrumb"><span class="muted">Testing operations</span><span class="muted">/</span><strong>Capacity planner</strong></div><div class="top-actions"><span class="pill blue">Synthetic demo</span><span class="muted">Center director</span><span class="avatar" aria-label="Center director">CD</span></div></header><main id="main" class="content" tabindex="-1"></main></div>

<script>
'use strict';
const DAYS=['Mon, Dec 9','Tue, Dec 10','Wed, Dec 11','Thu, Dec 12','Fri, Dec 13'];
const DATA={seats:{name:'General seats',unit:'seat-hours',short:'seat-h',cap:160,load:[132,154,178,168,126],known:.78,detail:'20 seats × 8 operating hours. Excludes individual rooms.'},rooms:{name:'Individual rooms',unit:'room-hours',short:'room-h',cap:24,load:[22,28,35,32,21],known:.72,detail:'Individual rooms operate 8 hours/day. Each room has one dedicated proctor in this demo. Enter multiples of 8 hours (8–80).'},readers:{name:'Reader support',unit:'staff-hours',short:'staff-h',cap:16,load:[12,15,20,18,10],known:.65,detail:'2 qualified readers × 8 hours. Reader time cannot be substituted with general proctor time.'}};
const STAGES={early:{name:'Before booking · Nov 28',date:'Nov 28',fraction:0,variance:.35},open:{name:'Booking opens · Dec 2',date:'Dec 2',fraction:.22,variance:.30},late:{name:'Planning update · Dec 6',date:'Dec 6',fraction:.58,variance:.25}};
const DEFAULT={view:'forecast',resource:'rooms',stage:'late',risk:'expected',day:2,sparse:false,extraRooms:0,extraStaff:0,extraHours:0,capacities:{seats:160,rooms:24,readers:16},saved:[],approved:null,materialReceived:false};
let state=structuredClone(DEFAULT);let toastTimer;const $=s=>document.querySelector(s);const money=n=>'$'+Math.round(n).toLocaleString('en-US');const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);const icon=(kind)=>kind==='download'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
try{const stored=JSON.parse(localStorage.getItem('rb-capacity-demo-v1')||'null');if(stored&&Array.isArray(stored.saved)){state.saved=stored.saved.filter(p=>p&&Number.isInteger(p.rooms)&&p.rooms>=0&&p.rooms<=3&&Number.isInteger(p.staff)&&p.staff>=0&&p.staff<=3&&Number.isInteger(p.hours)&&p.hours>=0&&p.hours<=2).slice(-6);}}catch{}
function persist(){try{localStorage.setItem('rb-capacity-demo-v1',JSON.stringify({saved:state.saved}));}catch{}}
function breakdown(resource,day){const r=DATA[resource],expected=r.load[day],booked=Math.round(expected*STAGES[state.stage].fraction),knownTotal=Math.round(expected*r.known),known=Math.max(0,knownTotal-booked),additional=expected-booked-known;return{expected,booked,known,additional,high:Math.ceil(expected*(1+STAGES[state.stage].variance))};}
function demand(resource,day){const d=breakdown(resource,day);return state.risk==='higher'?d.high:d.expected;}
function demandArray(resource){return DAYS.map((_,i)=>demand(resource,i));}
function scenario(rooms=state.extraRooms,staff=state.extraStaff,hours=state.extraHours){const base=state.capacities.rooms/8,physical=(base+rooms)*(8+hours),coverage=(base+staff)*(8+hours),capacity=Math.min(physical,coverage),cost=5*(rooms*40+staff*(8+hours)*28+base*hours*42),needs=demandArray('rooms'),shortfall=needs.reduce((a,n)=>a+Math.max(0,n-capacity),0),peak=Math.max(...needs);return{rooms,staff,hours,base,physical,coverage,capacity,cost,shortfall,peak,unused:Math.max(0,physical-coverage)};}
function bestPlan(){const plans=[];for(let r=0;r<=3;r++)for(let s=0;s<=3;s++)for(let h=0;h<=2;h++){const p=scenario(r,s,h);if(p.shortfall===0&&p.unused===0)plans.push(p);}return plans.sort((a,b)=>a.cost-b.cost||a.rooms-b.rooms)[0]||null;}
function badge(text,type=''){return `<span class="pill ${type}">${text}</span>`;}
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4500);}
function filters(){return `<div class="filters"><div class="filter-group"><label class="control">Forecast as of<select id="stage">${Object.entries(STAGES).map(([k,v])=>`<option value="${k}" ${state.stage===k?'selected':''}>${v.name}</option>`).join('')}</select></label><label class="control">Planning case<select id="risk"><option value="expected" ${state.risk==='expected'?'selected':''}>Expected demand</option><option value="higher" ${state.risk==='higher'?'selected':''}>Higher demand</option></select></label></div><button class="button text" data-action="method">How this estimate works ↗</button></div>`;}
function metric(label,value,unit,note,warn=false){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value mono">${value} <span>${unit}</span></div><div class="metric-note ${warn?'warn':''}">${note}</div></div>`;}
function header(title,sub,phase,action=''){return `<div class="page-header"><div><div class="eyebrow">Fall finals / December 9–13 · Illustrative dates</div><div class="row wrap"><h1>${title}</h1>${badge(phase,phase.includes('1')?'blue':'')}</div><p>${sub}</p></div>${action}</div>`;}
function chart(resource,capacity,compact=false){const r=DATA[resource],max=Math.ceil(Math.max(...DAYS.map((_,i)=>breakdown(resource,i).high),capacity)*1.18/10)*10,W=680,H=compact?230:290,L=45,T=22,B=43,plotH=H-T-B,base=H-B,step=120,x0=94,bw=42,y=n=>base-n/max*plotH;
let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${r.name}: confirmed, known unbooked and additional demand by day; higher-demand whiskers and capacity line. A table below provides exact values.">`;
for(let k=0;k<=4;k++){let v=max*k/4;svg+=`<line x1="${L}" y1="${y(v)}" x2="655" y2="${y(v)}" stroke="#e7ecf3"/><text x="${L-9}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#7b8899">${fmt(v)}</text>`;}
DAYS.forEach((_,i)=>{const b=breakdown(resource,i),x=x0+i*step,selected=i===state.day;svg+=`<g class="chart-day" data-action="day" data-day="${i}" tabindex="0" role="button" aria-label="Inspect ${DAYS[i]}"><rect class="hit" x="${x-48}" y="10" width="96" height="${H-14}" rx="7" fill="${selected?'#f2f5ff':'transparent'}"/>`;let acc=0;[[b.booked,'#2a55df'],[b.known,'#86a1ef'],[b.additional,'#cbd7f7']].forEach(([v,c])=>{svg+=`<rect x="${x-bw/2}" y="${y(acc+v)}" width="${bw}" height="${v/max*plotH}" fill="${c}"/>`;acc+=v;});svg+=`<line x1="${x}" x2="${x}" y1="${y(b.expected)}" y2="${y(b.high)}" stroke="#7587a5" stroke-width="1.4"/><line x1="${x-7}" x2="${x+7}" y1="${y(b.high)}" y2="${y(b.high)}" stroke="#7587a5" stroke-width="1.4"/><text x="${x+31}" y="${y(state.risk==='higher'?b.high:b.expected)-5}" font-size="12" font-weight="650" text-anchor="middle" fill="${demand(resource,i)>capacity?'#a95112':'#344663'}">${demand(resource,i)}</text><text x="${x}" y="${base+22}" font-size="12" font-weight="${selected?'700':'400'}" text-anchor="middle" fill="${selected?'#2a55df':'#6a798f'}">${['Mon 9','Tue 10','Wed 11','Thu 12','Fri 13'][i]}</text></g>`;});
svg+=`<line x1="${L}" y1="${y(capacity)}" x2="655" y2="${y(capacity)}" stroke="#a95112" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="544" y="${y(capacity)-18}" width="111" height="17" fill="white" rx="3"/><text x="651" y="${y(capacity)-6}" text-anchor="end" font-size="11" fill="#a95112">Capacity: ${capacity}</text></svg>`;return svg;}
function legend(){return '<div class="legend"><span><i class="swatch" style="background:#2a55df"></i>Booked</span><span><i class="swatch" style="background:#86a1ef"></i>Known, unbooked</span><span><i class="swatch" style="background:#cbd7f7"></i>Additional demand</span><span><i class="swatch dash"></i>Capacity</span></div>';}
function sourceFooter(){return '<div class="source-footer"><span>Northlake University · Synthetic demonstration data</span><button class="button text small" data-action="gates">View phased delivery gates →</button></div>';}
function forecast(){const r=DATA[state.resource],cap=state.capacities[state.resource],series=demandArray(state.resource),peak=Math.max(...series),gap=series.reduce((a,v)=>a+Math.max(0,v-cap),0),days=series.filter(v=>v>cap).length,total=series.reduce((a,v)=>a+v,0),b=breakdown(state.resource,state.day),selected=demand(state.resource,state.day),missing=state.sparse;
return header('See the peak before it arrives.','Plan for the demand you know—and the requests still to come.','Phase 1 · MVP',`<button class="button" data-action="export">${icon('download')} Export forecast</button>`)+filters()+
`<div class="metrics">${metric('Projected workload',missing?'—':total,r.short,missing?'Estimate withheld: insufficient history':'Across the five-day exam window')}${metric('Peak daily demand',missing?'—':peak,r.short,missing?'Confirmed bookings remain visible':`${Math.round(peak/cap*100)}% of daily capacity`,!missing&&peak>cap)}${metric('Projected shortfall',missing?'—':gap,r.short,missing?'Cannot assess from current data':`${days} ${days===1?'day':'days'} above available capacity`,!missing&&gap>0)}${metric('Materials pending',state.materialReceived?1:2,'exams','Readiness tracked separately from capacity')}</div>`+
`<div class="grid-main"><div><section class="card"><div class="card-head"><div><h2>Demand & available capacity</h2><p>${r.unit} per day · Selected case: ${state.risk==='higher'?'higher demand':'expected demand'}</p></div><button class="button text" data-action="capacity">Edit capacity</button></div><div class="card-body"><div class="resource-tabs" role="group" aria-label="Resource type">${Object.entries(DATA).map(([k,v])=>`<button class="${state.resource===k?'selected':''}" data-action="resource" data-resource="${k}" aria-pressed="${state.resource===k}">${v.name}</button>`).join('')}</div>${missing?`<div class="empty"><strong>Not enough comparable history</strong><p>Bookings are available, but additional demand cannot be estimated reliably for this resource.</p><p style="margin-top:10px">${DAYS.reduce((a,_,i)=>a+breakdown(state.resource,i).booked,0)} confirmed ${r.short} in this window. Enter a manual planning assumption or restore the demo history.</p><button class="button" style="margin-top:18px" data-action="restore">Restore demo history</button></div>`:`${legend()}<div class="chart-wrap">${chart(state.resource,cap)}</div><div class="chart-foot"><span>Whiskers: higher-demand scenario, not a confidence interval.</span><span>Select a day to inspect →</span></div><div class="insight ${gap===0?'good':''}"><strong>${gap?`${r.name}: ${gap} ${r.short} of shortfall`:'Daily resource totals fit the plan'}</strong><br>${gap?`${days} days need attention in the ${state.risk==='higher'?'higher-demand':'expected'} case. Check timing and resource compatibility before committing.`:'Daily totals do not guarantee a feasible appointment schedule. Check concurrent needs before committing.'}</div>`}</div></section><section class="card"><div class="card-head"><div><h2>Daily resource outlook</h2><p>Booked demand stays visible as the estimate evolves.</p></div>${badge(state.risk==='higher'?'Higher-demand case':'Expected case')}</div><div class="table-wrap"><table><thead><tr><th>Day</th><th>Booked</th><th>Projected</th><th>Capacity</th><th>Balance</th></tr></thead><tbody>${DAYS.map((d,i)=>{let n=demand(state.resource,i),diff=cap-n;return `<tr data-action="day" data-day="${i}"><td><strong>${d}</strong></td><td>${breakdown(state.resource,i).booked}</td><td>${missing?'—':n}</td><td>${cap}</td><td>${missing?badge('Unknown'):badge(diff<0?`${-diff} short`:`${diff} available`,diff<0?'orange':'green')}</td></tr>`;}).join('')}</tbody></table></div></section></div><aside class="sidebar-stack"><section class="card"><div class="card-head"><h2>${DAYS[state.day]}</h2>${badge('Selected day','blue')}</div><div class="card-body"><div class="eyebrow">${r.name}</div><div class="detail-value"><span>Confirmed bookings</span><strong>${b.booked} ${r.short}</strong></div><div class="detail-value"><span>Known, not booked</span><strong>${missing?'—':b.known}</strong></div><div class="detail-value"><span>Additional demand</span><strong>${missing?'—':b.additional}</strong></div><div class="mini-stack">${[[b.booked,'#2a55df'],[b.known,'#86a1ef'],[b.additional,'#cbd7f7']].map(([v,c])=>`<span style="width:${v/b.expected*100}%;background:${c}"></span>`).join('')}</div><div class="divider"></div><div class="detail-value"><strong>Expected total</strong><strong>${missing?'—':b.expected} ${r.short}</strong></div><div class="detail-value"><span>Higher-demand case</span><strong>${missing?'—':b.high} ${r.short}</strong></div><p class="note">${missing?'Forecast withheld. Avoid treating confirmed bookings as total demand.':`Additional demand allows for late accommodations and other room needs. The higher case adds ${Math.round(STAGES[state.stage].variance*100)}% to expected load in this illustrative model.`}</p><button class="button primary" style="width:100%;margin-top:18px" data-action="plan">Explore room scenarios ${icon('arrow')}</button><p class="small muted" style="margin-top:8px">Phase 2 preview · individual rooms</p></div></section><section class="card"><div class="card-head"><h2>Exam readiness</h2>${badge(state.materialReceived?'1 pending':'2 pending','orange')}</div><div class="card-body"><p class="note">Missing materials need faculty action. They do not remove expected demand.</p><div class="detail-value"><span>BIO 210 · Cell Biology</span>${badge(state.materialReceived?'Ready':'Pending',state.materialReceived?'green':'orange')}</div><div class="detail-value"><span>ECON 102 · Economics</span>${badge('Pending','orange')}</div><button class="button text" data-action="materials">Review material status →</button></div></section><section class="card"><div class="card-head"><h2>Planning timeline</h2></div><div class="timeline"><div class="timeline-item ${state.stage==='early'?'current':''}"><i class="timeline-point"></i><div><strong>Listings & early estimates</strong><span>Roster signals + historical load</span></div></div><div class="timeline-item ${state.stage==='open'?'current':''}"><i class="timeline-point"></i><div><strong>Dec 2 · Booking opens</strong><span>Seven days before the window</span></div></div><div class="timeline-item ${state.stage==='late'?'current':''}"><i class="timeline-point"></i><div><strong>Dec 6 · Planning update</strong><span>More appointments confirmed</span></div></div><div class="timeline-item"><i class="timeline-point"></i><div><strong>Dec 9–13 · Exam window</strong><span>Materials required before delivery</span></div></div></div></section></aside></div>`+sourceFooter();}
function stepper(key,label,sub,max){return `<div class="input-block"><label for="${key}">${label}</label><p>${sub}</p><div class="stepper"><button data-action="step" data-key="${key}" data-delta="-1" aria-label="Decrease ${label}" ${state[key]===0?'disabled':''}>−</button><input id="${key}" type="number" min="0" max="${max}" step="1" value="${state[key]}" aria-label="${label}"><button data-action="step" data-key="${key}" data-delta="1" aria-label="Increase ${label}" ${state[key]===max?'disabled':''}>+</button></div></div>`;}
function costRows(p){return `<div class="detail-value"><span>Overflow rooms · ${p.rooms} × $40 × 5 days</span><strong>${money(p.rooms*40*5)}</strong></div><div class="detail-value"><span>Added proctors · ${p.staff} × ${8+p.hours}h × $28 × 5</span><strong>${money(p.staff*(8+p.hours)*28*5)}</strong></div><div class="detail-value"><span>Existing proctors · ${p.base} × ${p.hours}h × $42 × 5</span><strong>${money(p.base*p.hours*42*5)}</strong></div><div class="divider"></div><div class="detail-value"><strong>Incremental five-day cost</strong><strong>${money(p.cost)}</strong></div>`;}
function scenarios(){const p=scenario(),baseline=scenario(0,0,0);return header('Find a plan that holds up.','Compare the resources, cost, and remaining gaps before making a commitment.','Phase 2 · Future',`<button class="button" data-action="funding">${icon('download')} Export funding brief</button>`)+`<div class="banner"><strong>Future phase</strong><span>Scenario planning for individual rooms. Assumed resource availability must be verified before an operational commitment.</span></div>`+filters()+`<div class="scenario-layout"><section class="card"><div class="card-head"><div><h2>Build a resource scenario</h2><p>Base: ${p.base} rooms, ${p.base} dedicated proctors, 8h/day</p></div></div><div class="card-body"><div class="scenario-inputs">${stepper('extraRooms','Additional rooms','$40 per room per day',3)}${stepper('extraStaff','Additional proctors','$28/hour · one per occupied room',3)}${stepper('extraHours','Extended hours per day','Existing proctors: $42/hour overtime',2)}</div><div class="budget-box"><span class="small muted">Incremental cost · full five-day window</span><strong>${money(p.cost)}</strong><span class="small muted">Illustrative rates; no spend is committed.</span></div><button class="button primary" style="width:100%;margin-top:16px" data-action="save">Save scenario</button><button class="button text" style="width:100%;margin-top:9px" data-action="clear-scenario">Reset resource changes</button></div></section><div><section class="card"><div class="card-head"><div><h2>Individual-room capacity</h2><p>Resource-hours are a planning screen; appointment concurrency still needs validation.</p></div>${badge(p.shortfall?'Gap remains':'Daily totals covered',p.shortfall?'orange':'green')}</div><div class="card-body"><div class="compare-grid"><div class="compare-panel"><h3>Current plan</h3><div class="big mono">${baseline.capacity} <span class="small muted">room-h/day</span></div><div class="bar-track"><div style="width:${Math.min(100,baseline.capacity/p.peak*100)}%"></div></div><p class="small muted">${baseline.shortfall} room-hours short across the week</p></div><div class="compare-panel after"><h3>Your scenario</h3><div class="big mono">${p.capacity} <span class="small muted">room-h/day</span></div><div class="bar-track"><div style="width:${Math.min(100,p.capacity/p.peak*100)}%;background:var(--green)"></div></div><p class="small muted">${p.shortfall} room-hours short across the week</p></div></div><div class="requirements"><div class="check ${p.unused?'bad':''}"><i>${p.unused?'!':'✓'}</i><span>${p.physical} physical room-hours; ${p.coverage} proctor-hours available per day.${p.unused?` ${p.unused} room-hours cannot be used without more staff.`:''}</span></div><div class="check ${p.shortfall?'bad':''}"><i>${p.shortfall?'!':'✓'}</i><span>Peak ${state.risk==='higher'?'higher-case':'expected'} demand: ${p.peak} room-hours. ${p.shortfall?'Additional coverage is still needed.':'Daily resource totals fit this scenario.'}</span></div><div class="check"><i>↳</i><span>General seating and reader support are outside this room scenario.</span></div></div>${chart('rooms',p.capacity,true)}<p class="note">Adding a room without a qualified proctor does not increase usable capacity. Forecast demand is held constant when comparing resource changes.</p></div></section><section class="card"><div class="card-head"><h2>Saved scenarios</h2>${badge('This browser only')}</div><div class="card-body">${state.saved.length?`<div class="saved-list">${state.saved.map((sp,i)=>{let x=scenario(sp.rooms,sp.staff,sp.hours);return `<div class="saved-plan"><div><strong>Scenario ${i+1} · ${x.rooms} rooms + ${x.staff} proctors + ${x.hours}h</strong><div class="small muted">${money(x.cost)} · ${x.capacity} room-h/day · ${x.shortfall} room-h short in current case</div></div><button class="button" data-action="load" data-index="${i}">Load</button></div>`;}).join('')}</div>`:'<p class="note">Save a scenario to compare it later. Saving does not reserve rooms or schedule staff.</p>'}</div></section></div></div>`+sourceFooter();}
function recommendations(){const p=bestPlan(),baseline=scenario(0,0,0);if(!p)return header('No feasible recommendation yet.','The available options do not cover the selected demand case.','Phase 3 · Future')+filters()+'<section class="card"><div class="empty"><strong>Expand the options or revisit the assumptions.</strong><p>None of the combinations in this demonstration provides enough staffed room-hours. Do not approve an incomplete plan.</p><button class="button" style="margin-top:15px" data-action="plan">Inspect scenarios</button><button class="button" style="margin-top:15px;margin-left:8px" data-action="capacity">Review base capacity</button></div></section>'+sourceFooter();return header('A recommendation you can inspect.','Review the assumptions and tradeoffs. You remain responsible for the resource decision.','Phase 3 · Future')+`<div class="banner"><strong>Future phase</strong><span>Rule-based demonstration, not a trained AI model. Approval records intent only; it does not change bookings, staffing, or budgets.</span></div>`+filters()+`<div class="grid-main"><div><section class="recommendation">${badge('Suggested room plan','blue')}<h2>Add ${p.rooms} ${p.rooms===1?'room':'rooms'}, ${p.staff} ${p.staff===1?'proctor':'proctors'}${p.hours?`, and ${p.hours} extra ${p.hours===1?'hour':'hours'}/day`:''}.</h2><p>The lowest-cost combination in this demo's bounded option set that covers every day's individual-room demand in the selected case.</p><div class="reasons"><div class="reason"><strong>${money(p.cost)}</strong><span>Incremental five-day cost</span></div><div class="reason"><strong>${p.capacity} room-h</strong><span>Staffed capacity per day</span></div><div class="reason"><strong>${baseline.shortfall} room-h</strong><span>Projected shortfall addressed</span></div></div><div class="requirements"><div class="check"><i>✓</i><span>Every added individual room has dedicated proctor coverage.</span></div><div class="check"><i>✓</i><span>Meets the ${state.risk==='higher'?'higher-demand':'expected'} case for daily room-hours.</span></div><div class="check"><i>↳</i><span>Room suitability, staff availability, and concurrent appointments still need director verification.</span></div></div><div class="row"><button class="button primary" data-action="review-approval">Review & approve demo plan</button><button class="button" data-action="inspect-plan">Adjust in scenarios</button></div></section><section class="card" style="margin-top:20px"><div class="card-head"><h2>Why this plan?</h2>${badge('Explainable')}</div><div class="card-body"><p class="note">The demonstration compares 0–3 additional rooms, 0–3 additional proctors, and 0–2 extended hours per day. It excludes options with insufficient daily coverage or unstaffed added room-hours, then selects the lowest incremental cost. This is not a full scheduling optimizer.</p><div class="divider"></div>${costRows(p)}<p class="note">Rates and availability are synthetic assumptions. Broader alternatives—such as moving exam windows—have not been evaluated.</p></div></section></div><aside class="sidebar-stack"><section class="card"><div class="card-head"><h2>Approval record</h2></div><div class="card-body">${state.approved?`<div class="row">${badge('Approved in demo','green')}</div><div class="audit-item"><strong>Center director</strong><div class="small muted">Approved during this session</div></div><div class="audit-item">${state.approved.rooms} rooms · ${state.approved.staff} proctors · ${state.approved.hours} extra h/day<div class="small muted">${money(state.approved.cost)} · ${state.approved.risk==='higher'?'Higher':'Expected'} demand · As of ${STAGES[state.approved.stage].date}</div></div><p class="note">This record retains the original assumptions. Changes to the forecast require a fresh review. No operational changes were made.</p>`:'<p class="note">No plan approved. The director must verify resource suitability, staffing availability, and appointment feasibility before recording approval.</p>'}</div></section><section class="card"><div class="card-head"><h2>When to stop</h2></div><div class="card-body"><p class="note">Pause recommendations if they violate a hard requirement. Retain useful forecasts if the recommendation layer fails to improve decisions.</p><button class="button text" data-action="gates">Inspect delivery gates →</button></div></section></aside></div>`+sourceFooter();}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===state.view);b.setAttribute('aria-current',b.dataset.nav===state.view?'page':'false');});$('#main').innerHTML=`<div class="view">${state.view!=='forecast'&&state.sparse&&state.resource==='rooms'?header('A room estimate is needed first.','Scenario evaluation is paused while individual-room history is insufficient.',state.view==='scenarios'?'Phase 2 · Future':'Phase 3 · Future')+'<section class="card"><div class="empty"><strong>Room demand has been withheld.</strong><p>Do not substitute confirmed bookings for total expected demand.</p><button class="button" style="margin-top:15px" data-action="restore">Restore demo history</button></div></section>':state.view==='forecast'?forecast():state.view==='scenarios'?scenarios():recommendations()}</div>`;}
function navigate(view){if(!['forecast','scenarios','recommendations'].includes(view))throw Error('Unknown view');state.view=view;history.replaceState(null,'','#'+view);render();window.scrollTo({top:0,behavior:'auto'});}
function modal(title,body,footer=''){const d=$('#dialog');d.innerHTML=`<div class="dialog-header"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="Close dialog">×</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;if(!d.open)d.showModal();}
function showMethod(){modal('What is behind this forecast?',`<p class="note">All numbers are synthetic and deliberately simplified for this prototype. There is no live SQL connection or trained forecasting model.</p><h3>Three non-overlapping components</h3><ul><li><strong>Booked:</strong> confirmed resource-hours, held fixed for planning.</li><li><strong>Known, unbooked:</strong> expected needs from current exam listings and approved accommodations.</li><li><strong>Additional:</strong> an allowance for late accommodation requests, other room needs, and demand not yet visible.</li></ul><p class="note">In production, comparable historical SQL records would inform additional demand, participation and timing variability. The demo uses fixed resource-hour totals and explicitly chosen percentages. Moving the as-of date converts known demand into bookings; it does not claim to simulate a real model update.</p><h3>Uncertainty, not false precision</h3><p class="note">The higher case is expected demand plus ${Math.round(STAGES[state.stage].variance*100)}%, rounded up. This is a planning scenario, not a calibrated probability. The expected and higher cases must be validated against missed shortages and unnecessary spending before use.</p><h3>Data and operating boundaries</h3><p class="note">School rosters and accommodation requirements are assumed available. History may omit turnaways. Daily resource-hours do not validate appointment concurrency. Materials readiness is independent of demand. No personal student data is included.</p><div class="divider"></div><label class="row small"><input type="checkbox" id="sparse" ${state.sparse?'checked':''}> Demonstrate insufficient history for the selected forecast</label><p class="small muted" style="margin-top:9px">This withholds the estimate while retaining confirmed bookings.</p>`);}
function showGates(){modal('Earn the next phase',`<p class="note">Proposed investment gates, not achieved results. Evaluate through a relevant peak or funding cycle. Stopping at a useful forecasting product is a valid outcome.</p><div class="phase-gates">${[
['0 · Validate','Three of five institutions show a consequential decision; two commit to a pilot; data supports an honest test.','Stop if no operating or funding decision can be improved. Narrow scope when data is missing.'],
['1 · Forecast','Three of five pilots demonstrate decision value. Meet agreed missed-shortage tolerances and match or beat the best practical baseline at the relevant lead time.','Stop after a bounded iteration without value or viable economics. Keep a useful simple model when complexity adds no benefit.'],
['2 · Plan','Proposed: three of five reduce planning time by 30%; two budget owners make a paid commitment; service outcomes do not worsen.','Retain forecast exports if customers prefer existing planning tools or configuration cost defeats the benefit.'],
['3 · Recommend','Improve on director-led planning; respect hard requirements; keep corrections low and deployment economics attractive.','Pause hard-constraint violations. Stop the recommendation layer if it does not improve decisions.']].map(([t,g,k])=>`<div class="gate"><h3>${t}</h3><p><strong>Continue:</strong> ${g}</p><p class="kill"><strong>Narrow or stop:</strong> ${k}</p></div>`).join('')}</div>`);}
function exportFile(filename,content,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export downloaded. All figures are synthetic.');}
function exportForecast(){let rows=['Synthetic RegisterBuddy capacity forecast','As of,'+STAGES[state.stage].name,'Planning case,'+state.risk,'Uncertainty note,Higher case is an illustrative scenario not a confidence interval','Resource,Day,Booked,Known unbooked,Additional,Expected,Higher case,Capacity,Selected case shortfall'];for(const [key,r] of Object.entries(DATA))DAYS.forEach((day,i)=>{let b=breakdown(key,i),withheld=state.sparse&&key===state.resource;rows.push([r.name,'"'+day+'"',b.booked,withheld?'unknown':b.known,withheld?'unknown':b.additional,withheld?'unknown':b.expected,withheld?'unknown':b.high,state.capacities[key],withheld?'unknown':Math.max(0,demand(key,i)-state.capacities[key])].join(','));});exportFile('registerbuddy-forecast.csv',rows.join('\n'),'text/csv;charset=utf-8');}
function funding(){const p=scenario(),b=scenario(0,0,0);exportFile('registerbuddy-funding-brief.txt',`NORTHLAKE UNIVERSITY — RESOURCE SCENARIO\nSYNTHETIC DEMONSTRATION; NOT AN APPROVED FUNDING REQUEST\n\nExam window: December 9–13 (illustrative dates)\nForecast as of: ${STAGES[state.stage].date}\nPlanning case: ${state.risk}\n\nCurrent individual-room capacity: ${b.capacity} room-hours/day\nCurrent projected weekly shortfall: ${b.shortfall} room-hours\nProposed additions: ${p.rooms} rooms, ${p.staff} proctors, ${p.hours} extended hours/day\nUsable proposed capacity: ${p.capacity} room-hours/day\nRemaining projected shortfall: ${p.shortfall} room-hours\nIncremental five-day cost: ${money(p.cost)}\n\nASSUMPTIONS\nRoom rental: $40/room/day. Added proctors: $28/hour. Existing proctors' overtime: $42/hour. One dedicated proctor per occupied individual room. Availability is assumed, not secured.\n\nForecast includes known demand and an allowance for late or unexpected requests. Higher demand is an illustrative scenario, not a calibrated probability. Validate room suitability, staff qualifications, concurrent appointments, and institutional cost assumptions. Other resource categories remain outside this plan. Missing exam materials require separate resolution. No bookings or budgets are changed.\n`,'text/plain;charset=utf-8');}
function reviewApproval(){const p=bestPlan();modal('Review the resource commitment',`<p>Proposed plan: <strong>${p.rooms} additional rooms, ${p.staff} proctors, ${p.hours} extended hours/day.</strong></p>${costRows(p)}<div class="insight good"><strong>${p.capacity} room-hours/day</strong><br>Daily totals cover the selected ${state.risk==='higher'?'higher-demand':'expected'} case. This is not an appointment-level feasibility guarantee.</div><div class="divider"></div><label class="row note"><input id="approval-check" type="checkbox"> For this demonstration, I have reviewed room suitability, staff availability, and concurrent appointment requirements.</label><p class="note" style="margin-top:15px">Approval records a demo decision in this session only. It does not book resources, notify anyone, or commit spending.</p>`,`<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="approve" id="approve-button" disabled>Approve demo plan</button>`);}
function saveScenario(){state.saved.push({rooms:state.extraRooms,staff:state.extraStaff,hours:state.extraHours});state.saved=state.saved.slice(-6);persist();render();toast('Scenario saved in this browser. No resources reserved.');}
function changeNumber(key,value){const max=key==='extraHours'?2:3;if(!['extraRooms','extraStaff','extraHours'].includes(key)||!Number.isInteger(value)||value<0||value>max)throw Error('Use a whole number within the allowed range.');state[key]=value;render();}
document.addEventListener('click',e=>{const target=e.target.closest('[data-nav],[data-action]');if(!target)return;if(target.dataset.nav){navigate(target.dataset.nav);return;}const a=target.dataset.action;switch(a){case 'day':state.day=Number(target.dataset.day);render();break;case 'resource':state.resource=target.dataset.resource;render();break;case 'method':showMethod();break;case 'gates':showGates();break;case 'close':$('#dialog').close();break;case 'plan':navigate('scenarios');break;case 'export':exportForecast();break;case 'funding':funding();break;case 'restore':state.sparse=false;render();break;case 'step':changeNumber(target.dataset.key,state[target.dataset.key]+Number(target.dataset.delta));break;case 'clear-scenario':state.extraRooms=state.extraStaff=state.extraHours=0;render();break;case 'save':saveScenario();break;case 'load':{const p=state.saved[Number(target.dataset.index)];state.extraRooms=p.rooms;state.extraStaff=p.staff;state.extraHours=p.hours;render();toast('Scenario loaded against the current demand case.');break;}case 'inspect-plan':{const p=bestPlan();state.extraRooms=p.rooms;state.extraStaff=p.staff;state.extraHours=p.hours;navigate('scenarios');break;}case 'review-approval':reviewApproval();break;case 'approve':if($('#approval-check')?.checked){state.approved={...bestPlan(),risk:state.risk,stage:state.stage};$('#dialog').close();render();toast('Demo approval recorded. No operational changes made.');}break;case 'capacity':modal('Available resource capacity',`<p class="note">Manual capacity inputs for Phase 1. Use qualified, usable resource-hours per day; apply a consistent five-day assumption for this demo.</p>${Object.entries(DATA).map(([k,r])=>`<div class="input-block"><label for="cap-${k}">${r.name} · ${r.unit}/day</label><p>${r.detail}</p><input id="cap-${k}" type="number" min="1" max="500" step="1" value="${state.capacities[k]}" style="border:1px solid var(--line);border-radius:6px;padding:8px;width:120px"></div>`).join('')}<p class="note">Individual-room capacity also updates the base plan in future phases. Each additional 8 room-hours assumes one suitable room and one dedicated proctor. These are planning inputs, not verified availability.</p>`,`<button class="button primary" data-action="save-capacity">Save capacity assumptions</button>`);break;case 'save-capacity':{let next={};for(let k of Object.keys(DATA)){let n=Number($('#cap-'+k).value);if(!Number.isInteger(n)||n<1||n>500){toast('Enter whole resource-hours from 1 to 500.');return;}if(k==='rooms'&&(n%8!==0||n>80)){toast('Individual-room capacity must be a multiple of 8, from 8 to 80.');return;}next[k]=n;}state.capacities=next;$('#dialog').close();render();toast('Capacity assumptions updated across the demo.');break;}case 'materials':modal('Exam materials readiness',`<p class="note">Materials must be submitted before the exam proceeds. The status below does not change expected resource demand.</p><div class="detail-value"><span><strong>BIO 210</strong><br>Cell Biology · Faculty submission</span>${badge(state.materialReceived?'Received':'Pending',state.materialReceived?'green':'orange')}</div><div class="detail-value"><span><strong>ECON 102</strong><br>Economics · Faculty submission</span>${badge('Pending','orange')}</div><p class="note" style="margin-top:18px">In this demo, receiving materials resolves only that preparation item; staff must still confirm all other exam prerequisites.</p>`,state.materialReceived?'':`<button class="button primary" data-action="receive-materials">Mark BIO 210 received · demo</button>`);break;case 'receive-materials':state.materialReceived=true;$('#dialog').close();render();toast('BIO 210 materials received. Forecast demand is unchanged.');break;case 'reset':modal('Reset the demonstration?',`<p>This clears scenarios saved by this prototype in this browser, demo approvals, and changed assumptions. It does not affect any real records.</p>`,`<button class="button" data-action="close">Keep working</button><button class="button primary" data-action="confirm-reset">Reset demo</button>`);break;case 'confirm-reset':state=structuredClone(DEFAULT);persist();$('#dialog').close();navigate('forecast');toast('Demonstration reset.');break;}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='stage'){state.stage=e.target.value;render();}else if(id==='risk'){state.risk=e.target.value;render();}else if(id==='sparse'){state.sparse=e.target.checked;render();}else if(id==='approval-check'){$('#approve-button').disabled=!e.target.checked;}else if(['extraRooms','extraStaff','extraHours'].includes(id)){try{changeNumber(id,Number(e.target.value));}catch(err){toast(err.message);render();}}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('chart-day')){e.preventDefault();state.day=Number(e.target.dataset.day);render();}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.target.close();}});
if(['forecast','scenarios','recommendations'].includes(location.hash.slice(1)))state.view=location.hash.slice(1);render();
if(document.modelContext?.registerTool){const lifetime=new AbortController();window.addEventListener('pagehide',()=>lifetime.abort(),{once:true});const tools=[{name:'inspect_capacity_plan',description:'Read the selected synthetic planning case and current room scenario.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({view:state.view,stage:state.stage,risk:state.risk,scenario:scenario(),recommendation:bestPlan(),synthetic:true})},{name:'stage_room_scenario',description:'Stage a synthetic room scenario in the visible Phase 2 screen. Does not save, approve, or commit resources.',inputSchema:{type:'object',properties:{rooms:{type:'integer',minimum:0,maximum:3},proctors:{type:'integer',minimum:0,maximum:3},extraHours:{type:'integer',minimum:0,maximum:2}},required:['rooms','proctors','extraHours'],additionalProperties:false},annotations:{readOnlyHint:false},execute:(input)=>{if(!input||Object.keys(input).some(k=>!['rooms','proctors','extraHours'].includes(k))||!Number.isInteger(input.rooms)||input.rooms<0||input.rooms>3||!Number.isInteger(input.proctors)||input.proctors<0||input.proctors>3||!Number.isInteger(input.extraHours)||input.extraHours<0||input.extraHours>2)throw Error('Invalid resource scenario');state.extraRooms=input.rooms;state.extraStaff=input.proctors;state.extraHours=input.extraHours;navigate('scenarios');return{staged:true,...scenario(),synthetic:true};}}];for(const tool of tools){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifetime.signal})).catch(()=>{});}catch{}}}
</script>
</body>
</html>
